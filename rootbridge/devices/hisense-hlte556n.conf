# Hisense A9 (HLTE556N), checked on 2026-11-26 with LineageOS (TrebleDroid GSI, Android 14).
# The vendor partition says "Hisense" and "HLTE556N"; the GSI says "QUALCOMM" in ro.product.manufacturer.
LABEL="Hisense A9"
NAME=hisense-a9
# side key: gpio-keys at event2, scan code 0x2fe; short and double presses stay with the E-Ink app
SIDEKEY_DEVICE=/dev/input/event2
SIDEKEY_CODE=766
# key of a wired headset: the input device whose name has "Button Jack", KEY_MEDIA
HEADSET_DEVICE_NAME=Button Jack
HEADSET_CODE=226
# long press on Home: Android's assistant gesture, which starts Termux push to talk
HOMEKEY_METHOD=assistant
# seconds a key is held for a long press (Android's long_press_timeout)
LONG_PRESS=0.4
