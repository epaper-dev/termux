# Onyx Boox Max Lumi, checked on 2026-11-27 with the stock firmware (Android 10, kernel 4.4).
LABEL="Onyx Boox Max Lumi"
NAME=boox
# hardware Home button below the screen: qpnp_pon, KEY_BACK; hold to talk, a long press also wakes the device.
# Short presses stay "back", and the firmware keeps its own long press (front light on and off).
SIDEKEY_DEVICE_NAME=qpnp_pon
SIDEKEY_CODE=158
SIDEKEY_WAKE=yes
# USB-C headset (Synaptics Hi-Res Audio), its key is KEY_PLAYPAUSE; the built-in "Button Jack" is not used
HEADSET_DEVICE_NAME=Synaptics Hi-Res Audio
HEADSET_CODE=164
# long press on the touch Home button: Android's assistant gesture, which starts Termux push to talk
HOMEKEY_METHOD=assistant
# the firmware freezes (disables) apps; without Termux:API no root request is shown: the installer says what to switch off
APP_FREEZE=boox
# seconds a key is held for a long press (Android's long_press_timeout)
LONG_PRESS=0.4
