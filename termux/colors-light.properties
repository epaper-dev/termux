# Light colour scheme (black on white, E-Ink friendly) of termux-root-bridge.
# The E-Paper Termux build (epaper-dev/termux) uses this file instead of colors.properties while the
# phone is in light mode; in dark mode colors.properties or Termux' own dark default applies.
# Other Termux builds ignore it: copy it to colors.properties there to get the light scheme.
background=#FFFFFF
foreground=#000000
cursor=#000000

color0=#000000
color1=#990000
color2=#006600
color3=#665500
color4=#000099
color5=#660066
color6=#006666
color7=#BBBBBB
color8=#555555
color9=#CC0000
color10=#008800
color11=#886600
color12=#0000BB
color13=#880088
color14=#008888
color15=#FFFFFF
