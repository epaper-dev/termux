name: Rootbridge tests

# The installer in rootbridge/ (moved here from hisense-a9/termux-root-bridge). Runs when it changes.
on:
  push:
    paths: ['rootbridge/**', '.github/workflows/rootbridge_tests.yml']
  pull_request:
    paths: ['rootbridge/**', '.github/workflows/rootbridge_tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rootbridge
    steps:
      - uses: actions/checkout@v6
      - name: Unit tests (guard + login hook + Codex pre-commit review hook with a stub node)
        run: python3 -I -m unittest discover -s tests -p 'test_*.py'
      - name: Integration test (daemon, client, installers' helpers)
        run: bash tests/test_daemon.sh
      - name: claude() wrapper in the generated .bashrc (stubbed claude)
        run: bash tests/test_claude_wrapper.sh
      - name: NOFILE_LIMIT, Claude Code starts with a lower fd limit (stubbed command, staging root)
        run: bash tests/test_nofile_limit.sh
      - name: claude update at most once a day, CLAUDE_UPDATE (stubbed claude / proot-distro, staging root)
        run: bash tests/test_claude_update.sh
      - name: Termux extra keys row, S-TAB and KEYBOARD (fake HOME/PREFIX, stubbed reload)
        run: bash tests/test_extra_keys.sh
      - name: Session ends with Claude Code, shell only after an error (stub claude / bash)
        run: bash tests/test_session_exit.sh
      - name: --autonomous defaults to yes, no / ask / invalid values (guest installer and install.sh, stubbed proot-distro)
        run: bash tests/test_autonomous.sh
      - name: automatic setup of a fresh device and setup-guest.sh (stubbed pkg / proot-distro / apt-get / curl)
        run: bash tests/test_setup.sh
      - name: Remote Control name (install.sh / install-guest.sh, stubbed proot-distro)
        run: bash tests/test_remote_name.sh
      - name: Colours, reload at start and Claude Code theme (stubbed proot-distro / termux-reload-settings)
        run: bash tests/test_colors_theme.sh
      - name: apt update + upgrade at session start (stubbed apt-get / apt-mark / dpkg / proot-distro)
        run: bash tests/test_apt_upgrade.sh
      - name: rootbridge shell is a plain shell, attach creates the session (stub daemon / tmux / proot-distro)
        run: bash tests/test_rootbridge_shell.sh
      - name: Daemon lock (one daemon, install.sh keeps a live lock; real daemon loop in a temp dir)
        run: bash tests/test_daemon_lock.sh
      - name: Widgets and icons (install.sh / uninstall.sh, fake HOME, stubs)
        run: bash tests/test_widgets.sh
      - name: Claude Code theme Auto epaper follows light/dark (rootbridge theme, tmux hooks; fake HOME/PREFIX, stub tmux)
        run: bash tests/test_theme_follow.sh
      - name: Codex next to Claude Code (rootbridge-update / rootbridge-codex / rootbridge codex-* / install.sh options; stubs)
        run: bash tests/test_codex.sh
      - name: OpenCode as the third tool and who reviews the commits (install-guest / rootbridge-update / rootbridge-opencode / rootbridge / install.sh; stubs)
        run: bash tests/test_opencode.sh
      - name: ptt, push to talk through a tmux key (hold and tap mode, settings; stub tmux)
        run: bash tests/test_ptt.sh
      - name: Voice dictation (microphone, PulseAudio, sox, /voice settings), reading aloud (Piper, switch, widgets) and the side key reader (stubs for pulseaudio / pactl / su / pkg)
        run: bash tests/test_voice.sh
      - name: Guest library of the guest scripts (config reader, update intervals, session helpers; a missing library stops every script)
        run: bash tests/test_guest_lib.sh
      - name: Guest stays small (old Claude Code / Codex versions pruned, uutils copies become GNU links; fake folders, staged root)
        run: bash tests/test_guest_slim.sh
      - name: Device file (found by the vendor partition, asked once, device.conf, key questions, name suggestion; stub getprop)
        run: bash tests/test_device.sh
      - name: Performance check (cores, clock, memory, space, verdicts; made-up /proc and /sys)
        run: bash tests/test_perf.sh
      - name: Ubuntu or Debian as the guest, the switch with backup, restore and work folder (stub proot-distro / rootbridge)
        run: bash tests/test_distro.sh
      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning \
            install.sh uninstall.sh \
            termux/bin/rootbridge termux/bin/rootbridge-daemon termux/bin/ptt termux/lib/rootbridge-lib.sh \
            guest/bin/androidsu guest/bin/rootbridge-open guest/bin/rootbridge-claude guest/bin/rootbridge-codex guest/bin/rootbridge-update guest/bin/rootbridge-apt guest/bin/rootbridge-speak \
            guest/install-guest.sh guest/setup-guest.sh tests/*.sh
