# Built-in color scheme of the dark theme: white on black, with light colors only (E-Ink friendly). It is used while
# the dark theme is in use and neither colors-dark.properties nor colors.properties exists in ~/.termux.
# Every text color (color1 to color15, foreground) keeps R+G+B at 576 or more, so it stays above the middle (384) even when dimmed (2/3): Android's
# "High contrast text" draws such text solid white instead of black with a white outline (hollow letters).
background=#000000
foreground=#FFFFFF
cursor=#FFFFFF

color0=#000000
color1=#FFA8A8
color2=#A8FFA8
color3=#FFFF80
color4=#B0B0FF
color5=#FF80FF
color6=#80FFFF
color7=#E0E0E0
color8=#C8C8C8
color9=#FFC0C0
color10=#C0FFC0
color11=#FFFFC0
color12=#C8C8FF
color13=#FFC0FF
color14=#C0FFFF
color15=#FFFFFF
